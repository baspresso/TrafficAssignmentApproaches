[network]
dataset = "Sydney"

[solver]
approach = "Tapas"
approach_alpha = 1e-10
budget_function_multiplier = 0.0001
budget_upper_bound = 100_000.0

[metrics]
enable_trace = true
write_metadata_json = true
write_summary_csv = true

[[pipeline]]
type = "optimality_condition"
max_iterations = 5
tolerance = 1e-4
