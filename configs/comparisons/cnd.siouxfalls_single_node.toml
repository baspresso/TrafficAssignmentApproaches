[comparison]
description = "SiouxFalls_Single_NODE CNDP Algorithm Comparison"
time_limit = 1800
etalon_time_limit = 7200

[defaults.network]
dataset = "SiouxFalls_single_od_1_6_demand_38000"

[defaults.solver]
approach = "RouteBased"
approach_alpha = 1e-14
budget_function_multiplier = 5.0
budget_upper_bound = 40_000.0

[defaults.metrics]
enable_trace = true
write_metadata_json = true
write_summary_csv = true
flush_every_n_points = 10

# --- Etalon ---

[[scenarios]]
name = "Etalon"
description = "Reference solution (COBYLA 200)"
etalon = true
[[scenarios.pipeline]]
type = "nlopt"
algorithm = "LN_COBYLA"
max_iterations = 200
tolerance = 1e-4

# --- Single-algorithm scenarios ---

[[scenarios]]
name = "COBYLA"
description = "COBYLA 100 iterations"
color = "#1f77b4"
[[scenarios.pipeline]]
type = "nlopt"
algorithm = "LN_COBYLA"
max_iterations = 100
tolerance = 1e-4

[[scenarios]]
name = "BOBYQA"
description = "BOBYQA 100 iterations"
color = "#17becf"
[[scenarios.pipeline]]
type = "nlopt"
algorithm = "LN_BOBYQA"
max_iterations = 100
tolerance = 1e-4

[[scenarios]]
name = "OptCond"
description = "Optimality condition 100 iterations"
color = "#d62728"
[[scenarios.pipeline]]
type = "optimality_condition"
max_iterations = 100