[network]
dataset = "Sydney_demand_5x"

[solver]
approach = "Tapas"
approach_alpha = 1e-10
budget_function_multiplier = 0.1
budget_upper_bound = 800.0

[metrics]
enable_trace = true
write_metadata_json = true
write_summary_csv = true

[[pipeline]]
type = "optimality_condition"
max_iterations = 20
tolerance = 1e-4
